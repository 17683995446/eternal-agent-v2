# 永动知识图谱Agent - Docker Compose配置
# 遵循"大事做于细，难事成于易"原则

version: '3.8'

services:
  # 主服务
  eternal-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eternal-agent
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=INFO
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "from health import HealthChecker; hc = HealthChecker(); exit(0 if hc.check()['healthy'] else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - agent-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # 监控服务（可选）
  prometheus:
    image: prom/prometheus:latest
    container_name: eternal-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - agent-network
    profiles:
      - monitoring

  # 可视化仪表板（可选）
  grafana:
    image: grafana/grafana:latest
    container_name: eternal-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - agent-network
    profiles:
      - monitoring
    depends_on:
      - prometheus

networks:
  agent-network:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
